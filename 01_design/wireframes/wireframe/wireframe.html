<!doctype html>
<!--
  Core SaaS wireframe set (01_design/wireframes/20261113_wireframe_design.md).
  Self-contained: inline CSS + a small JS builder, no network.
  Rendered to PDF by render.mjs (Playwright, A4 landscape, one .page per sheet).
  Every screen is built (B08–B11); drawn from the running app and the B09/B10
  walk screenshots (updated 2026-11-20).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Core SaaS Wireframes</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  :root {
    --ink: #1f1f1f; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf;
    --fill: #ececec; --fill2: #f6f6f6; --paper: #fff; --accent: #2f6fd6;
    --built: #1d7a46; --planned: #b26a00; --ph: #7a4bc2; --warn: #fff1c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #888; font: 11px/1.35 "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  /* One A4 landscape sheet = 1123 x 794 CSS px. */
  .page { width: 1123px; height: 794px; background: var(--paper); margin: 0 auto 12px; overflow: hidden;
          display: grid; grid-template-rows: 44px 1fr 22px; page-break-after: always; break-after: page; }
  @media print { html, body { background: #fff; } .page { margin: 0; } }
  .head { display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 2px solid var(--ink); }
  .head .sid { font: 700 18px/1 monospace; }
  .head .stitle { font-size: 17px; font-weight: 600; }
  .head .route { margin-left: auto; font: 12px monospace; color: var(--mid); }
  .foot { display: flex; justify-content: space-between; padding: 0 22px; font-size: 9px; color: var(--soft); border-top: 1px solid var(--line); align-items: center; }
  .body { display: grid; grid-template-columns: 1fr 250px; min-height: 0; }
  .stage { padding: 14px 16px 10px 22px; min-height: 0; overflow: hidden; }
  .panel { border-left: 1px solid var(--line); background: var(--fill2); padding: 12px 14px; overflow: hidden; font-size: 10px; }
  .panel h4 { margin: 10px 0 3px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--mid); }
  .panel h4:first-child { margin-top: 0; }
  .panel ul { margin: 0; padding-left: 14px; } .panel li { margin: 1px 0; }
  .panel code, .mono { font-family: monospace; font-size: 9.5px; }
  .status { display: inline-block; padding: 3px 8px; border-radius: 3px; font: 700 10px monospace; color: #fff; }
  .s-built { background: var(--built); } .s-planned { background: var(--planned); } .s-ph { background: var(--ph); }

  /* ---------- wireframe primitives ---------- */
  .frame { border: 1.5px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .frame .chrome { height: 16px; background: var(--fill); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 6px; flex: none; }
  .frame .chrome i { width: 6px; height: 6px; border-radius: 50%; background: var(--soft); }
  .frame .chrome span { margin-left: 8px; font: 8.5px monospace; color: var(--mid); }
  .flabel { font: 600 9.5px/1 sans-serif; color: var(--mid); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .06em; }
  .devbar { background: var(--warn); text-align: center; font-size: 8.5px; padding: 2px; flex: none; }
  .verifybar { background: var(--fill); text-align: center; font-size: 9px; padding: 4px; border-bottom: 1px solid var(--line); flex: none; }
  .topbar { height: 30px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 10px; flex: none; }
  .topbar b { font-weight: 600; } .topbar .org { color: var(--mid); border-left: 1px solid var(--line); padding-left: 8px; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--mid); }
  .avatar { width: 16px; height: 16px; border-radius: 50%; background: var(--fill); display: inline-grid; place-items: center; font-size: 8px; }
  .bell { position: relative; } .bell sup { position: absolute; top: -5px; right: -7px; background: var(--ink); color: #fff; border-radius: 6px; font-size: 7px; padding: 0 3px; }
  .shell { display: grid; grid-template-columns: 118px 1fr; flex: 1; min-height: 0; }
  .side { background: var(--fill2); border-right: 1px solid var(--line); padding: 6px 5px; }
  .nav { display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 4px; color: var(--ink); }
  .nav.on { background: var(--fill); font-weight: 600; } .nav.off { color: var(--soft); }
  .nav .ic { width: 9px; height: 9px; border: 1.2px solid currentColor; border-radius: 2px; flex: none; }
  .nav .soon { margin-left: auto; font-size: 7px; border: 1px solid var(--line); border-radius: 6px; padding: 0 3px; }
  .main { padding: 10px 14px; overflow: hidden; min-height: 0; }
  .ptitle { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; margin: 2px 0 10px; }
  .ptitle .act { margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; } .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .span2 { grid-column: span 2; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; }
  .card .ct { display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 11px; margin-bottom: 5px; }
  .card .ct .ic { width: 9px; height: 9px; border: 1.2px solid var(--mid); border-radius: 2px; }
  .muted { color: var(--mid); } .small { font-size: 9px; } .big { font-size: 20px; font-weight: 400; }
  .pill { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 0 5px; font-size: 8px; color: var(--mid); background: #fff; }
  .pill.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill.red { background: #c62828; color: #fff; border-color: #c62828; }
  .pill.phc { border-color: var(--ph); color: var(--ph); border-style: dashed; }
  .row { display: flex; align-items: center; gap: 6px; } .between { justify-content: space-between; }
  .field { margin: 0 0 7px; } .field label { display: block; font-size: 9.5px; font-weight: 500; margin-bottom: 2px; }
  .input { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 20px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font-size: 9px; color: var(--soft); background: #fff; }
  .input.ro { background: var(--fill2); } .input.err { border-color: #c62828; }
  .ferr { color: #c62828; font-size: 8.5px; margin-top: 1px; } .hint { color: var(--mid); font-size: 8.5px; margin-top: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 20px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font-size: 9px; background: #fff; white-space: nowrap; }
  .btn.pri { background: var(--ink); color: #fff; border-color: var(--ink); } .btn.full { width: 100%; } .btn.dis { opacity: .45; } .btn.danger { background: #c62828; color: #fff; border-color: #c62828; }
  .alert { border: 1px solid #c62828; color: #c62828; border-radius: 4px; padding: 4px 6px; font-size: 9px; margin-bottom: 7px; background: #fff6f6; }
  .alert.ok { border-color: var(--built); color: var(--built); background: #f3fbf6; }
  .link { color: var(--accent); text-decoration: underline; }
  table.t { width: 100%; border-collapse: collapse; font-size: 9px; } .t th { text-align: left; font-weight: 500; color: var(--mid); border-bottom: 1px solid var(--line); padding: 3px 4px; }
  .t td { border-bottom: 1px solid var(--fill); padding: 3px 4px; } .t .r { text-align: right; }
  .bar { height: 6px; border-radius: 3px; background: var(--fill); } .bar.w { background: var(--line); }
  .ph { background: repeating-linear-gradient(45deg, var(--fill2) 0 6px, var(--fill) 6px 12px); border: 1px dashed var(--soft); border-radius: 4px; display: grid; place-items: center; color: var(--mid); font-size: 9px; }
  .pubwrap { flex: 1; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; }
  .pubwrap .brand { font-size: 13px; margin-bottom: 8px; }
  .pcard { width: 230px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 12px 14px; }
  .pcard h3 { margin: 0 0 2px; font-size: 12px; font-weight: 500; } .pcard .sub { color: var(--mid); font-size: 9px; margin-bottom: 9px; }
  .dialog { position: absolute; background: #fff; border: 1.5px solid var(--ink); border-radius: 7px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
  .callout { flex: none; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 9px/16px sans-serif; text-align: center; z-index: 5; }
  .notes ol { margin: 0; padding-left: 16px; } .notes li::marker { color: var(--accent); font-weight: 700; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px; } .tabs span:not(.callout) { padding: 3px 9px; font-size: 9.5px; color: var(--mid); }
  .tabs span.on:not(.callout) { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 600; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; margin: 0 auto 6px; }
  .toast { position: absolute; right: 10px; bottom: 10px; background: #fff; border: 1px solid var(--ink); border-radius: 5px; padding: 6px 9px; font-size: 9px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .drop { border: 1.5px dashed var(--soft); border-radius: 6px; padding: 14px; text-align: center; color: var(--mid); }
  .stateTile { display: flex; flex-direction: column; }
  mark { background: #ffe9a8; padding: 0 1px; }
  .cover h1 { font-size: 34px; margin: 0 0 4px; font-weight: 600; } .cover h2 { font-size: 14px; font-weight: 400; color: var(--mid); margin: 0 0 18px; }
  .idx td, .idx th { padding: 3px 6px; font-size: 10px; } .idx th { text-align: left; border-bottom: 1.5px solid var(--ink); }
  .idx td { border-bottom: 1px solid var(--fill); }
</style>
</head>
<body>
<div id="out"></div>
<script>
/* ===================== builder helpers ===================== */
const DEV = "Dev: emails go to Mailpit (192.168.50.113:8025)";
const NAV_ALL = [
  ["Home", null], ["Files", "files:read"], ["Search", "search:use"], ["Users", "users:read"],
  ["Organization", "org:read"],
];
// Sidebar entries per role (b04live grants, config/navigation.ts). Items (B11)
// shows for every tenant role: all five hold items:read.
const ROLE_NAV = {
  owner: ["Home", "Files", "Search", "Users", "Organization", "Items"],
  admin: ["Home", "Files", "Search", "Users", "Organization", "Items"],
  manager: ["Home", "Files", "Search", "Users", "Organization", "Items"],
  staff: ["Home", "Files", "Search", "Items"],          // b04live staff lacks org:read
  user: ["Home", "Files", "Search", "Organization", "Items"],
  platform: ["Home", "Platform"],
  none: ["Home"],
};

function side(role, active, built, extra = [], mark) {
  const items = ROLE_NAV[role].concat(extra);
  return `<div class="side">${items.map(l => {
    // Since B10/B11 every page is built: no "soon" badges anywhere.
    const soon = false && built && !["Home", "Platform"].includes(l);
    return `<div class="nav ${l === active ? "on" : ""} ${soon ? "off" : ""}"><span class="ic"></span>${l}${mark && mark[0] === l ? ci(mark[1]) : ""}${soon ? '<span class="soon">soon</span>' : ""}</div>`;
  }).join("")}</div>`;
}
function topbar({ org = "B04 Live", user = "owner@b04live.test", bell = false, burger = false, c = {} }) {
  return `<div class="topbar">${burger ? "☰ " : ""}<b>Core SaaS</b><span class="org">${org}</span>${c.top ? ci(c.top) : ""}
    <span class="right">${c.bell ? ci(c.bell) : ""}${bell ? '<span class="bell">🔔<sup>3</sup></span>' : ""}<span class="avatar">${user[0].toUpperCase()}</span>${burger ? "" : user}</span></div>`;
}
/** Full app-shell frame. */
function app({ role = "owner", active = "Home", built = true, org, user, bell, verify, content, url, h, extraNav, style = "", c = {} }) {
  return `<div class="frame" style="height:${h || 600}px;${style}">
    <div class="chrome"><i></i><i></i><i></i><span>192.168.50.113:3200${url || ""}</span></div>
    <div class="devbar">${DEV}${c.dev ? ci(c.dev) : ""}</div>${topbar({ org, user, bell, c })}
    ${verify ? `<div class="verifybar">Please verify your email address (${user}). Some data stays hidden until you do. <span class="btn">Resend email</span>${c.verify ? ci(c.verify) : ""}</div>` : ""}
    <div class="shell">${side(role, active, built, extraNav, c.side)}<div class="main">${content}</div></div></div>`;
}
/** Public-layout frame: dev bar, product name, centred card. */
function pub({ card, url, h = 600, w }) {
  return `<div class="frame" style="height:${h}px;${w ? `width:${w}px;` : ""}">
    <div class="chrome"><i></i><i></i><i></i><span>192.168.50.113:3200${url || ""}</span></div>
    <div class="devbar">${DEV}</div>
    <div class="pubwrap"><div class="brand">Core SaaS</div>${card}</div></div>`;
}
const pcard = (title, sub, body) => `<div class="pcard"><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ""}${body}</div>`;
const field = (label, val = "", o = {}) => `<div class="field"><label>${label}</label><div class="input ${o.ro ? "ro" : ""} ${o.err ? "err" : ""}">${val}</div>${o.err ? `<div class="ferr">${o.err}</div>` : ""}${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
const btn = (t, c = "") => `<span class="btn ${c}">${t}</span>`;
const card = (title, body, cls = "") => `<div class="card ${cls}">${title ? `<div class="ct"><span class="ic"></span>${title}</div>` : ""}${body}</div>`;
const pill = (t, c = "") => `<span class="pill ${c}">${t}</span>`;
const ci = n => `<span class="callout" style="position:static;display:inline-block;vertical-align:middle;margin:0 3px;font-weight:700">${n}</span>`;
const call = (n, x, y) => `<div class="callout" style="left:${x}px;top:${y}px">${n}</div>`;
const table = (heads, rows, rightCols = []) => `<table class="t"><tr>${heads.map((h, i) => `<th class="${rightCols.includes(i) ? "r" : ""}">${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${rightCols.includes(i) ? "r" : ""}">${c}</td>`).join("")}</tr>`).join("")}</table>`;
const welcome = (who, role, org = "B04 Live · <span class='mono'>b04live</span>") =>
  card(`Welcome, ${who}`, `<div class="muted small">${org}</div><div class="row small" style="margin-top:5px"><span class="muted">Signed in as ${who}</span>${pill(role, "dark")}</div>`, "span2");
// Live cards drawn as built in B10 (D14).
const fileList = (title, rows = [["Q3-report.pdf", "11-12"], ["logo.png", "11-12"], ["notes.txt", "11-09"]]) =>
  card(title, rows.map(([n, d]) => `<div class="row between small"><span class="link">${n}</span><span class="muted">${d}</span></div>`).join("") + `<div class="small link" style="margin-top:5px">All files →</div>`);
const linkCard = (title, text) => card(title, `<div class="muted small">${text}</div><div class="small link" style="margin-top:5px">Open ${title.replace(/<[^>]*>/g, "").toLowerCase()} →</div>`);
const phCard = (title, text, batch) => card(title, `<div class="muted small">${text}</div><div style="margin-top:5px">${pill(batch, "phc")}</div>`);
const tile = (label, inner, w) => `<div class="stateTile" ${w ? `style="width:${w}px"` : ""}><div class="flabel">${label}</div>${inner}</div>`;

const STATUS = { built: ["s-built", "BUILT"], planned: ["s-planned", "PLANNED"], ph: ["s-ph", "PLACEHOLDER"] };
/** One sheet. */
function page({ id = "", title, route = "", status, batch = "", access, api = [], states = [], notes = [], stage, panel = true }) {
  const st = status ? `<span class="status ${STATUS[status][0]}">${STATUS[status][1]} ${batch}</span>` : "";
  const list = a => a.length ? `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>` : "<div class='muted'>—</div>";
  const side = panel ? `<div class="panel">
      <h4>Status</h4>${st}
      <h4>Route</h4><code>${route || "—"}</code>
      <h4>Access</h4>${access || "—"}
      <h4>API</h4>${list(api.map(a => `<code>${a}</code>`))}
      <h4>States</h4>${list(states)}
      ${notes.length ? `<h4>Notes</h4><div class="notes"><ol>${notes.map(n => `<li>${n}</li>`).join("")}</ol></div>` : ""}
    </div>` : "";
  return `<section class="page" data-id="${id}">
    <div class="head"><span class="sid">${id}</span><span class="stitle">${title}</span><span class="route">${route}</span></div>
    <div class="body" ${panel ? "" : 'style="grid-template-columns:1fr"'}><div class="stage">${stage}</div>${side}</div>
    <div class="foot"><span>Core SaaS scaffold · wireframes · low fidelity, not to scale</span><span>2026-11-20 · page {{N}} of {{T}}</span></div>
  </section>`;
}

/* ===================== pages ===================== */
const P = [];

/* 1 Cover + index */
const INDEX = [
  ["—", "Screen map", "—", "—"],
  ["§1", "Layouts: public card, app shell, mobile drawer", "—", "BUILT B08"],
  ["S01", "Login", "/login", "BUILT B09"],
  ["S02", "Forgot / reset password", "/forgot-password, /reset-password", "BUILT B09"],
  ["S03", "Verify email + unverified banner", "/verify-email", "BUILT B09"],
  ["S04", "Accept invite", "/accept-invite", "BUILT B09"],
  ["S05", "Post-login + no organization", "/post-login, /no-organization", "BUILT B09"],
  ["S06", "Org picker: dropped (one org per user, B04 D1)", "—", "DROPPED"],
  ["S07", "Owner landing", "/home/owner", "BUILT B09"],
  ["S07", "Admin + manager landing", "/home/admin, /home/manager", "BUILT B09"],
  ["S07", "Staff + user landing", "/home/staff, /home/user", "BUILT B09"],
  ["S07", "Platform", "/platform", "BUILT B09"],
  ["S08", "Files", "/files", "BUILT B10"],
  ["S09", "Search", "/search", "BUILT B10"],
  ["S10", "Users + invitations", "/users", "BUILT B10"],
  ["S11", "Profile", "/settings/profile", "BUILT B10"],
  ["S12", "Organization settings", "/settings/organization", "BUILT B10"],
  ["S13", "Exports dialog", "(dialog)", "BUILT B10"],
  ["S14", "Notifications bell", "(top bar)", "BUILT B10"],
  ["S15", "Template items", "/items", "BUILT B11"],
  ["S16", "Errors + session expired", "/403, /404, any", "BUILT B08"],
];
P.push(page({ id: "", title: "Core SaaS: Wireframes", panel: false, stage: `
  <div class="cover" style="display:grid;grid-template-columns:330px 1fr;gap:28px;height:100%">
    <div>
      <h1>Core SaaS</h1><h2>Wireframes of every screen: Phase 1 scaffold</h2>
      <p>Low fidelity, greyscale. One screen (or one screen's states) per page. The side panel on each page lists the route, the permission, the API calls behind it, its states and its build status.</p>
      <p>Every screen is <b>built</b> (B08–B11) and drawn as it looks in the running app on 2026-11-20. Differences from <code>ui_screens.md</code> are user decisions noted on each page (e.g. no item history, no role filter).</p>
      <p style="margin-top:14px"><span class="status s-built">BUILT</span> live in the app (all screens)<br><br>
      <span class="status s-ph">PLACEHOLDER</span> ${pill("arrives in a business module", "phc")} card on a built page that still waits for data (only “Recent activity”)</p>
      <p style="margin-top:14px" class="muted">Sources: 01_design/ui_screens.md · api_spec.md · frontend/src/config/navigation.ts, landing.ts · 05_stage09/shots/, 05_stage10/shots/. Source HTML: 01_design/wireframes/wireframe/wireframe.html</p>
      <p class="muted">Blue numbered dots <span class="callout" style="position:static;display:inline-block">1</span> point at the notes in each page's side panel.</p>
    </div>
    <div><table class="idx" style="width:100%;border-collapse:collapse"><tr><th>Page</th><th>ID</th><th>Screen</th><th>Route</th><th>Status</th></tr>
      ${(() => { let n = 2; return INDEX.map(r => `<tr><td>${r[0] === "S06" ? "—" : n++}</td><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td><td>${r[3]}</td></tr>`).join(""); })()}
    </table></div>
  </div>` }));

/* 2 Screen map (SVG) */
function box(x, y, w, h, t, sub, kind) {
  const fill = { b: "#eef7f1", p: "#fff6e8", n: "#f2f2f2", d: "#fff" }[kind || "b"];
  const stroke = { b: "#1d7a46", p: "#b26a00", n: "#555", d: "#999" }[kind || "b"];
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.4" ${kind === "d" ? 'stroke-dasharray="4 3"' : ""}/>
    <text x="${x + w / 2}" y="${y + (sub ? h / 2 - 2 : h / 2 + 4)}" text-anchor="middle" font-size="11" font-weight="600">${t}</text>
    ${sub ? `<text x="${x + w / 2}" y="${y + h / 2 + 11}" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">${sub}</text>` : ""}`;
}
const arr = (x1, y1, x2, y2, lbl, lx, ly) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>${lbl ? `<text x="${lx ?? (x1 + x2) / 2}" y="${ly ?? (y1 + y2) / 2 - 4}" font-size="9" fill="#444" text-anchor="middle">${lbl}</text>` : ""}`;
P.push(page({ id: "MAP", title: "Screen map", panel: false, stage: `
<svg width="1080" height="700" viewBox="0 0 1080 700" font-family="Helvetica, Arial, sans-serif">
