<!doctype html>
<!--
  Core SaaS application flows, drawn (01_design/app_flows.md F1–F13, as built
  through B11, 2026-11-20). Self-contained: inline CSS + a small JS builder.
  Rendered to ../appFlows.pdf by render.mjs (Playwright, A4 landscape).
  Rebuild: bash 01_design/process_flows/build_appFlows.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Core SaaS Application Flows</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  :root {
    --ink: #1f1f1f; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf;
    --fill: #ececec; --fill2: #f6f6f6; --paper: #fff; --accent: #2f6fd6;
    --ok: #1d7a46; --warn: #fff4cc; --warnline: #d8b64a; --err: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #888; font: 11px/1.35 "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  .page { width: 1123px; height: 794px; background: var(--paper); margin: 0 auto 12px; overflow: hidden;
          display: grid; grid-template-rows: 44px 1fr 22px; page-break-after: always; break-after: page; }
  @media print { html, body { background: #fff; } .page { margin: 0; } }
  .head { display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 2px solid var(--ink); }
  .head .sid { font: 700 18px/1 monospace; }
  .head .stitle { font-size: 17px; font-weight: 600; }
  .head .route { margin-left: auto; font: 12px monospace; color: var(--mid); }
  .foot { display: flex; justify-content: space-between; padding: 0 22px; font-size: 9px; color: var(--soft); border-top: 1px solid var(--line); align-items: center; }
  .body { display: grid; grid-template-columns: 1fr 260px; min-height: 0; }
  .body.full { grid-template-columns: 1fr; }
  .stage { padding: 12px 14px 8px 18px; min-height: 0; overflow: hidden; }
  .panel { border-left: 1px solid var(--line); background: var(--fill2); padding: 12px 14px; overflow: hidden; font-size: 10px; }
  .panel h4 { margin: 9px 0 3px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--mid); }
  .panel h4:first-child { margin-top: 0; }
  .panel ul { margin: 0; padding-left: 14px; } .panel li { margin: 1px 0; }
  .panel code, .mono { font-family: monospace; font-size: 9.5px; }
  .delta { background: var(--warn); border: 1px solid var(--warnline); border-radius: 4px; padding: 5px 7px; }
  .cover { padding: 26px 30px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; }
  .cover h1 { font-size: 30px; margin: 0 0 4px; } .cover h2 { font-size: 16px; font-weight: 400; margin: 0 0 14px; color: var(--mid); }
  .cover p { margin: 0 0 10px; }
  table.idx { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  table.idx th, table.idx td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.idx th { font-size: 9px; text-transform: uppercase; color: var(--mid); letter-spacing: .06em; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font: 700 9px monospace; color: #fff; background: var(--ok); }
  .tag.drop { background: #888; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 10.5px; margin-top: 8px; }
  svg text { font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
</head>
<body>
<script>
"use strict";
const DATE = "2026-11-20";
const pages = [];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ------------------------------------------------------------ participants */
// One lane per participant. `kind` picks the header colour.
const P = {
  user:    { label: "User", sub: "browser", kind: "person" },
  owner:   { label: "Owner / Admin", sub: "browser", kind: "person" },
  invitee: { label: "Invitee", sub: "browser + mail", kind: "person" },
  fe:      { label: "Frontend", sub: "Next.js :3200", kind: "fe" },
  be:      { label: "API", sub: "FastAPI :8200", kind: "be" },
  db:      { label: "Postgres", sub: "public + tenant_<slug>", kind: "store" },
  redis:   { label: "Redis", sub: "rate limit · cache · queue", kind: "store" },
  w:       { label: "Worker", sub: "arq jobs", kind: "be" },
  s3:      { label: "RustFS", sub: "S3 :9000 (LAN IP)", kind: "store" },
  mail:    { label: "Mailpit", sub: "SMTP :1025 · UI :8025", kind: "ext" },
};
const KIND = {
  person: ["#fff", "#1f1f1f"], fe: ["#e8f0fd", "#2f6fd6"], be: ["#eef7f1", "#1d7a46"],
  store: ["#f4efe6", "#8a6a2f"], ext: ["#f2f2f2", "#555"],
};

/* -------------------------------------------------------- text wrapping */
const CHAR_W = 5.3; // ~px per char at 10px Helvetica
function wrap(text, maxPx) {
  const max = Math.max(8, Math.floor(maxPx / CHAR_W));
  const out = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const w of para.split(" ")) {
      if ((line + " " + w).trim().length > max && line) { out.push(line); line = w; }
      else line = (line + " " + w).trim();
    }
    out.push(line);
  }
  return out;
}
const tspans = (lines, x, anchor = "middle") =>
  lines.map((l, i) => `<tspan x="${x}" dy="${i ? 11 : 0}" text-anchor="${anchor}">${esc(l)}</tspan>`).join("");

/* ------------------------------------------------------ sequence diagram */
// A "work" box may be wider than its lane (it overlaps the neighbours' life lines).
const SELF_W = (laneW) => Math.min(laneW * 1.45, 230);
// steps: {f,t,m}   message (solid; r:true = reply, dashed)
//        {self,m}  work inside one participant
//        {note,over:[a,b]} or {note,at:a}  yellow note
//        {alt}     fragment divider ("alt"/"else"/"loop"/"opt" via kind)
function seq(lanes, steps, W = 820, H = 690) {
  const left = 6, laneW = (W - 2 * left) / lanes.length, top = 44;
  const xi = (id) => {
    const i = lanes.indexOf(id);
    if (i < 0) throw new Error(`lane ${id} not in ${lanes}`);
    return left + laneW * (i + 0.5);
  };
  // 1) measure every step
  const items = steps.map((s) => {
    if (s.alt !== undefined) return { s, h: 20 };
    if (s.note !== undefined) {
      const [a, b] = s.over ?? [s.at, s.at];
      const width = Math.abs(xi(b) - xi(a)) + laneW * 0.9;
      const lines = wrap(s.note, width - 12);
      return { s, lines, width, h: lines.length * 11 + 12 };
    }
    if (s.self !== undefined) {
      const lines = wrap(s.m, SELF_W(laneW) - 14);
      return { s, lines, h: Math.max(26, lines.length * 11 + 14) };
    }
    const span = Math.abs(xi(s.t) - xi(s.f));
    const lines = wrap(s.m, Math.max(span - 14, laneW * 1.6));
    return { s, lines, h: lines.length * 11 + 19 };
  });
  let total = items.reduce((a, b) => a + b.h, 0);
  const scale = Math.min(1.35, (H - top - 10) / total); // spread short flows, squeeze long ones
  if (scale < 0.82) throw new Error(`diagram too tall (${Math.round(total)}px)`);
  let y = top + 8, n = 0, out = [];
  // lane heads + life lines
  lanes.forEach((id) => {
    const p = P[id], [bg, fg] = KIND[p.kind], x = xi(id), bw = laneW - 10;
    out.push(`<line x1="${x}" y1="${top}" x2="${x}" y2="${H - 4}" stroke="#bbb" stroke-dasharray="3 3"/>`);
    out.push(`<rect x="${x - bw / 2}" y="2" width="${bw}" height="36" rx="5" fill="${bg}" stroke="${fg}" stroke-width="1.4"/>
      <text x="${x}" y="17" font-size="11" font-weight="700" text-anchor="middle" fill="${fg}">${esc(p.label)}</text>
      <text x="${x}" y="30" font-size="8.5" text-anchor="middle" fill="#666">${esc(p.sub)}</text>`);
  });
  for (const it of items) {
    const s = it.s, h = it.h * scale;
    if (s.alt !== undefined) {
      const kind = s.kind ?? "alt";
      out.push(`<line x1="${left}" y1="${y + h / 2}" x2="${W - left}" y2="${y + h / 2}" stroke="#999" stroke-dasharray="6 3"/>
        <rect x="${left}" y="${y + h / 2 - 8}" width="${Math.min(W - 2 * left, esc(s.alt).length * 5.6 + 46)}" height="16" fill="#fff" stroke="#999"/>
        <text x="${left + 5}" y="${y + h / 2 + 4}" font-size="9.5"><tspan font-weight="700">${kind}</tspan> ${esc(s.alt)}</text>`);
    } else if (s.note !== undefined) {
      const [a, b] = s.over ?? [s.at, s.at];
      const cx = (xi(a) + xi(b)) / 2, x0 = cx - it.width / 2;
      out.push(`<rect x="${x0}" y="${y + 3}" width="${it.width}" height="${h - 6}" rx="3" fill="#fff4cc" stroke="#d8b64a"/>
        <text x="${cx}" y="${y + 3 + (h - 6 - it.lines.length * 11) / 2 + 9}" font-size="9.5">${tspans(it.lines, cx)}</text>`);
    } else if (s.self !== undefined) {
      const x = xi(s.self), bw = SELF_W(laneW);
      n++;
      out.push(`<rect x="${x - bw / 2}" y="${y + 3}" width="${bw}" height="${h - 6}" rx="4" fill="${s.err ? "#fdecea" : "#fafafa"}" stroke="${s.err ? "#b42318" : "#999"}"/>
        ${num(x - bw / 2, y + 3, n)}
        <text x="${x}" y="${y + 3 + (h - 6 - it.lines.length * 11) / 2 + 9}" font-size="9.5" fill="${s.err ? "#b42318" : "#1f1f1f"}">${tspans(it.lines, x)}</text>`);
    } else {
      const x1 = xi(s.f), x2 = xi(s.t), dir = x2 > x1 ? 1 : -1, ay = y + h - 7;
      const color = s.err ? "#b42318" : s.r ? "#555" : "#1f1f1f";
      n++;
      out.push(`<line x1="${x1}" y1="${ay}" x2="${x2 - dir * 3}" y2="${ay}" stroke="${color}" stroke-width="1.3" ${s.r ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#${s.r ? "ah2" : s.err ? "ahE" : "ah"})"/>
        ${num(Math.min(x1, x2) - 9, ay - 6, n, true)}
        <text x="${(x1 + x2) / 2}" y="${ay - 9 - (it.lines.length - 1) * 11}" font-size="9.5" fill="${color}">${tspans(it.lines, (x1 + x2) / 2)}</text>`);
    }
    y += h;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>${["ah:#1f1f1f", "ah2:#555", "ahE:#b42318"].map((d) => { const [id, c] = d.split(":"); return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`; }).join("")}</defs>
    ${out.join("\n")}</svg>`;
}
function num(x, y, n, onArrow = false) {
  const cx = onArrow ? x : x + 1, cy = onArrow ? y + 6 : y + 1;
  return `<circle cx="${cx}" cy="${cy}" r="7" fill="#2f6fd6"/><text x="${cx}" y="${cy + 3}" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">${n}</text>`;
}

/* ------------------------------------------------- pipeline (F11–F13) */
// cols: [{title, kind, steps: [text | {t, sub}]}], drawn as boxes with arrows down.
function pipe(cols, W = 820, H = 690) {
  const gap = 18, cw = (W - gap * (cols.length - 1)) / cols.length;
  let out = [];
  cols.forEach((c, ci) => {
    const x = ci * (cw + gap), [bg, fg] = KIND[c.kind ?? "be"];
    out.push(`<rect x="${x}" y="2" width="${cw}" height="30" rx="5" fill="${bg}" stroke="${fg}" stroke-width="1.4"/>
      <text x="${x + cw / 2}" y="21" font-size="11.5" font-weight="700" text-anchor="middle" fill="${fg}">${esc(c.title)}</text>`);
    const boxes = c.steps.map((s) => (typeof s === "string" ? { t: s } : s));
    const measured = boxes.map((b) => {
      const tl = wrap(b.t, cw - 34), sl = b.sub ? wrap(b.sub, cw - 34) : [];
      return { b, tl, sl, h: 14 + tl.length * 12 + sl.length * 11 };
    });
    const avail = H - 46, need = measured.reduce((a, m) => a + m.h, 0) + 16 * (measured.length - 1);
    const sp = Math.max(10, Math.min(28, (avail - need + 16 * (measured.length - 1)) / Math.max(1, measured.length - 1)));
    let y = 44;
    measured.forEach((m, i) => {
      out.push(`<rect x="${x + 4}" y="${y}" width="${cw - 8}" height="${m.h}" rx="5" fill="${m.b.err ? "#fdecea" : "#fff"}" stroke="${m.b.err ? "#b42318" : "#999"}"/>
        ${num(x + 6, y + 2, i + 1)}
        <text x="${x + 22}" y="${y + 15}" font-size="10" font-weight="600">${tspans(m.tl, x + 22, "start")}</text>
        ${m.sl.length ? `<text x="${x + 22}" y="${y + 15 + m.tl.length * 12}" font-size="9" fill="#666" font-family="monospace">${tspans(m.sl, x + 22, "start")}</text>` : ""}`);
      if (i < measured.length - 1)
        out.push(`<line x1="${x + cw / 2}" y1="${y + m.h}" x2="${x + cw / 2}" y2="${y + m.h + sp - 2}" stroke="#1f1f1f" stroke-width="1.3" marker-end="url(#ah)"/>`);
      y += m.h + sp;
    });
    if (y > H + 2) throw new Error(`pipeline column "${c.title}" too tall`);
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>${out.join("\n")}</svg>`;
}

/* ----------------------------------------------------------- page frame */
function panel(p) {
  const list = (h, xs) => (xs && xs.length ? `<h4>${h}</h4><ul>${xs.map((x) => `<li>${x}</li>`).join("")}</ul>` : "");
  return `<div class="panel">
    <h4>Status</h4><span class="tag">BUILT ${p.batch}</span>
    ${list("Trigger", p.trigger)}${list("Permissions", p.perm)}${list("API", (p.api || []).map((a) => `<code>${esc(a)}</code>`))}
    ${list("Rules and edge cases", p.rules)}
    ${p.delta ? `<h4>As built vs app_flows.md</h4><div class="delta">${p.delta}</div>` : ""}
  </div>`;
}
function page({ id, title, route = "", stage, full = false, ...p }) {
  pages.push(`<section class="page" data-id="${id}">
    <div class="head"><span class="sid">${id}</span><span class="stitle">${esc(title)}</span><span class="route">${esc(route)}</span></div>
    <div class="body ${full ? "full" : ""}"><div class="stage">${stage}</div>${full ? "" : panel(p)}</div>
    <div class="foot"><span>Core SaaS scaffold · application flows (01_design/app_flows.md) · as built through B11</span><span>${DATE} · page {{N}} of {{T}}</span></div>
  </section>`);
}

/* ================================================================ pages */
const INDEX = [
  ["F1", "Login and role-based landing", "/login → /post-login → /home/&lt;role&gt;", "built"],
  ["F2", "Session refresh", "any 401", "built"],
  ["F3", "Invite and accept", "/users → email → /accept-invite", "built"],
  ["F4", "Forgot / reset password", "/forgot-password → /reset-password", "built"],
  ["F5", "Switch organization", "one organization per user (B04 D1)", "dropped"],
  ["F6", "Upload a file", "/files → Upload", "built"],
  ["F7", "Download (and delete) a file", "/files row menu", "built"],
  ["F8", "Search and filter", "/search · list filters", "built"],
  ["F9", "Export", "Export on Files / Users / Items", "built"],
  ["F10", "Manage roles", "/users → Change roles · seeds", "built"],
  ["F11", "Platform admin tasks", "CLI · /platform", "built"],
  ["F12", "Audit read", "host: logs/audit/audit.log", "built"],
  ["F13", "Add a business module", "developer: copy _template", "built"],
];

/* 1 cover */
pages.push(`<section class="page" data-id="COVER">
  <div class="head"><span class="sid">—</span><span class="stitle">Application flows</span><span class="route">Phase 1 scaffold</span></div>
  <div class="cover">
    <div>
      <h1>Core SaaS</h1><h2>Application flows, drawn: Phase 1 scaffold</h2>
      <p>One flow per page, from <code>01_design/app_flows.md</code>. Each page is a numbered sequence across the parts of the system that take part; the side panel lists the trigger, the permissions, the API calls and the rules.</p>
      <p>Flows are drawn <b>as built</b> through B11 (${DATE}). Where the build differs from <code>app_flows.md</code> (user decisions, or detail added while building), the yellow box on the page says so. The same flows in text, as built: <code>01_design/app_flow_v2.md</code>.</p>
      <div class="legend">
        <svg width="70" height="12"><line x1="0" y1="6" x2="62" y2="6" stroke="#1f1f1f" stroke-width="1.3" marker-end="url(#lg1)"/><defs><marker id="lg1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs></svg><span>request / call</span>
        <svg width="70" height="12"><line x1="0" y1="6" x2="62" y2="6" stroke="#555" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#lg2)"/><defs><marker id="lg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs></svg><span>answer</span>
        <svg width="70" height="12"><line x1="0" y1="6" x2="62" y2="6" stroke="#b42318" stroke-width="1.3" marker-end="url(#lg3)"/><defs><marker id="lg3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs></svg><span>error / refusal path</span>
        <svg width="70" height="14"><rect x="1" y="1" width="62" height="12" rx="3" fill="#fafafa" stroke="#999"/></svg><span>work done inside one part</span>
        <svg width="70" height="14"><rect x="1" y="1" width="62" height="12" rx="3" fill="#fff4cc" stroke="#d8b64a"/></svg><span>note</span>
        <svg width="70" height="14"><line x1="0" y1="7" x2="62" y2="7" stroke="#999" stroke-dasharray="6 3"/></svg><span><b>alt</b> / <b>loop</b> / <b>opt</b>: alternative path, repetition, optional step</span>
        <svg width="70" height="16"><circle cx="8" cy="8" r="7" fill="#2f6fd6"/><text x="8" y="11" font-size="8.5" fill="#fff" font-weight="700" text-anchor="middle">1</text></svg><span>step number, in order</span>
      </div>
    </div>
    <div><table class="idx"><tr><th>Page</th><th>ID</th><th>Flow</th><th>Where</th><th>Status</th></tr>
      ${(() => { let n = 3; return INDEX.map((r) => `<tr><td>${r[3] === "dropped" ? "—" : n++}</td><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="mono" style="font-size:9.5px">${r[2]}</td><td><span class="tag ${r[3] === "dropped" ? "drop" : ""}">${r[3].toUpperCase()}</span></td></tr>`).join(""); })()}
    </table>
    <p class="mono" style="margin-top:12px;color:var(--mid);font-size:9.5px">Source: 01_design/process_flows/source/appFlows.html · rebuild: bash 01_design/process_flows/build_appFlows.sh</p></div>
  </div>
  <div class="foot"><span>Core SaaS scaffold · application flows (01_design/app_flows.md) · as built through B11</span><span>${DATE} · page {{N}} of {{T}}</span></div>
</section>`);

/* 2 system map */
(() => {
  const B = (x, y, w, h, kind, t, sub) => { const [bg, fg] = KIND[kind]; return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${bg}" stroke="${fg}" stroke-width="1.6"/><text x="${x + w / 2}" y="${y + h / 2 - 3}" font-size="13" font-weight="700" text-anchor="middle" fill="${fg}">${t}</text><text x="${x + w / 2}" y="${y + h / 2 + 12}" font-size="9.5" text-anchor="middle" fill="#555">${sub}</text>`; };
  const A = (x1, y1, x2, y2, l, lx, ly, dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1f1f1f" stroke-width="1.4" ${dash ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#ma)"/>${l ? `<text x="${lx ?? (x1 + x2) / 2}" y="${ly ?? (y1 + y2) / 2 - 5}" font-size="9.5" text-anchor="middle" fill="#444">${l}</text>` : ""}`;
  const L = (pts, l, lx, ly, dash) => `<polyline points="${pts}" fill="none" stroke="#1f1f1f" stroke-width="1.4" ${dash ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#ma)"/>${l ? `<text x="${lx}" y="${ly}" font-size="9.5" fill="#444">${l}</text>` : ""}`;
  const svg = `<svg width="820" height="690" viewBox="0 0 820 690"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
    ${B(20, 40, 150, 60, "person", "User", "browser on the LAN")}
    ${B(250, 40, 170, 60, "fe", "Frontend", "Next.js :3200")}
    ${B(500, 40, 170, 60, "be", "API", "FastAPI :8200")}
    ${B(700, 40, 115, 60, "store", "Postgres", "public + tenant_*")}
    ${B(20, 250, 150, 60, "person", "Developer", "shell · CLI · DBeaver")}
    ${B(260, 250, 160, 60, "store", "Redis", "limits · cache · queue")}
    ${B(500, 250, 170, 60, "be", "Worker", "email · export · cleanup")}
    ${B(700, 250, 115, 60, "ext", "Mailpit", "SMTP · UI :8025")}
    ${B(250, 440, 170, 60, "store", "RustFS", "S3 :9000 · presigned")}
    ${B(500, 440, 170, 60, "ext", "Audit log", "logs/audit/audit.log")}
    ${A(170, 70, 248, 70)}<text x="176" y="62" font-size="9.5" fill="#444">pages</text>
    ${A(420, 70, 498, 70)}<text x="424" y="62" font-size="9.5" fill="#444">/api/* + cookies</text><text x="430" y="86" font-size="9.5" fill="#444">X-Tenant</text>
