# Alembic configuration: two independent migration tracks (design B02 §3.3).
#
#   uv run alembic -n public upgrade head
#   uv run alembic -n tenant -x schema=tenant_acme upgrade head
#
# Normally you do NOT call alembic directly: use `make migrate` /
# `python -m app.cli migrate-all`, which call app.core.migrations.
# The database URL always comes from DATABASE_URL (app.config), never from here.

[public]
script_location = %(here)s/migrations/public
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[tenant]
script_location = %(here)s/migrations/tenant
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
