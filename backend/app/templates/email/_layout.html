<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ app_name }}</title></head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:6px;">
    <tr><td style="padding:24px 28px;border-bottom:1px solid #e4e4e7;font-size:18px;font-weight:bold;">{{ app_name }}</td></tr>
    <tr><td style="padding:24px 28px;font-size:15px;line-height:1.5;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:16px 28px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">
      If you did not expect this email, you can ignore it.
    </td></tr>
  </table>
</body>
</html>
