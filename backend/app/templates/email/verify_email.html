{% extends "_layout.html" %}
{% block body %}
<p>Hello{% if full_name %} {{ full_name }}{% endif %},</p>
<p>Please confirm your email address for {{ app_name }}.</p>
<p><a href="{{ link }}" style="display:inline-block;padding:10px 18px;background:#18181b;color:#ffffff;text-decoration:none;border-radius:4px;">Verify email</a></p>
<p style="font-size:13px;color:#52525b;">Or paste this link into your browser:<br>{{ link }}</p>
<p style="font-size:13px;color:#52525b;">The link is valid for 24 hours and can be used once.</p>
{% endblock %}
