# Dev stack for the core SaaS scaffold.
# First run: docker compose up   (no .env needed; see README_CLONING.md)
# Every host port, the project name and the cookie prefix come from .env, so
# several clones can run on one machine. Ports INSIDE the containers are fixed.
# The project name (containers, network, volumes) is COMPOSE_PROJECT_NAME, else
# the folder name. Copy kept in 01_design/docker_compose.yml.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
  REDIS_URL: redis://redis:6379/0
  # URLs follow PUBLIC_HOST and the ports below unless set explicitly (B13 D4).
  FRONTEND_URL: ${FRONTEND_URL:-http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3200}}
  TENANT_HEADER: X-Tenant
  ACCESS_TOKEN_MINUTES: "15"
  REFRESH_TOKEN_DAYS: "14"
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Browsers share cookies between ports of one host: one prefix per clone
  # (B13 D6). "-" not ":-": an empty COOKIE_PREFIX= means plain names.
  COOKIE_PREFIX: ${COOKIE_PREFIX-${COMPOSE_PROJECT_NAME}_}
  SEED_DEMO: ${SEED_DEMO:-true}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
  APP_NAME: ${APP_NAME:-Core SaaS}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@app.local}
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://${PUBLIC_HOST:-localhost}:${S3_API_PORT:-9000}}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccesskey}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-devsecretkey-change-me}
  S3_BUCKET: ${S3_BUCKET:-app-files}
  AUDIT_LOG_DIR: /var/log/app/audit
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3200},http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3200}}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-}
  EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
  EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
  EXPORT_CLEANUP_HOUR: ${EXPORT_CLEANUP_HOUR:-3}
  EXPORT_CLEANUP_MINUTE: ${EXPORT_CLEANUP_MINUTE:-45}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_HOST_PORT:-5200}:5432"   # host 5200 for DBeaver; containers still use postgres:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. RustFS replaces MinIO (MinIO stopped
  # publishing images in 2025; decision 2026-11-11, B00). Path-style addressing
  # only: S3 clients must set addressing_style="path".
  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccesskey}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-devsecretkey-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # B05 D1: the browser PUTs/GETs presigned URLs straight to :9000 from the
      # frontend origin(s), so the S3 API must answer CORS for them.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3200},http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3200}}
    ports:
      - "${S3_API_PORT:-9000}:9000"          # S3 API (browser uses presigned URLs against this)
      - "${S3_CONSOLE_PORT:-9201}:9001"      # web console at /rustfs/console/ (host 9201: 9001 is taken by Penpot)
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the private application bucket (idempotent).
  storage-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-devaccesskey}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-devsecretkey-change-me}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-app-files}
    entrypoint: >
      /bin/sh -c "
      if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null;
      then echo bucket $${S3_BUCKET} already exists;
      else aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $${S3_BUCKET} && echo bucket $${S3_BUCKET} created;
      fi"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"    # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"      # web UI
    environment:
      MP_MAX_MESSAGES: "5000"

  # One-shot: migrate, sync permissions, seed the demo org (dev). Runs on every
  # `up`, safe to repeat; the API and worker start only if it succeeds (B13 D7).
  init:
    image: ${COMPOSE_PROJECT_NAME}-backend
    pull_policy: never          # built by the backend service
    command: ["python", "-m", "app.cli", "init"]
    environment:
      <<: *backend-env
      CLI_USER: init
    volumes:
      - ./backend:/app
      - ./logs/audit:/var/log/app/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend
    build:
      context: ./backend
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8200 --reload --reload-dir app"
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8200}:8200"
    volumes:
      - ./backend:/app
      - ./logs/audit:/var/log/app/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8200/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: ${COMPOSE_PROJECT_NAME}-backend
    pull_policy: never          # built by the backend service
    command: ["arq", "app.worker.settings.WorkerSettings", "--watch", "/app/app", "--custom-log-dict", "app.worker.settings.ARQ_LOG_CONFIG"]
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./logs/audit:/var/log/app/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    command: ["pnpm", "dev", "--port", "3200", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-dev}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Core SaaS}
      NEXT_PUBLIC_MAILPIT_PORT: ${MAILPIT_UI_PORT:-8025}
      COOKIE_PREFIX: ${COOKIE_PREFIX-${COMPOSE_PROJECT_NAME}_}   # server side only (proxy.ts)
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-${PUBLIC_HOST:-localhost}}
      # B10 D5: upload checks in the browser mirror the backend's limits.
      NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      NEXT_PUBLIC_ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-}
      BACKEND_INTERNAL_URL: http://backend:8200      # used by next.config rewrites
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3200}:3200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  s3data:
